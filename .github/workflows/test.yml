name: test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, systemd, sockets, package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: test-linux-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-linux
      - run: mise run test
      - run: mise run test:systemd
      - run: mise run test:sockets
      - run: mise run package:check

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [alpine:3, debian:bookworm-slim, fedora:44]
    concurrency:
      group: test-docker-${{ matrix.image }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-docker-${{ matrix.image }}
      - run: mise run test:docker
        env:
          TESTINFRA_TEST_IMAGE: ${{ matrix.image }}
