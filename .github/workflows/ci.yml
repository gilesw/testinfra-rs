name: CI
on: [push, pull_request]
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --all-targets --locked
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: bash tests/fixtures/systemd.sh
      - run: cargo test --locked --test infrastructure docker_sockets -- --ignored --nocapture
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [alpine:3, debian:bookworm-slim, fedora:44]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --test infrastructure docker_resources -- --ignored --nocapture
        env:
          TESTINFRA_TEST_IMAGE: ${{ matrix.image }}
