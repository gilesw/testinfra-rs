name: lint

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: hk lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          experimental: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: mise run lint
      - name: Assert checks changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the checks modified the working tree:" >&2
            git status --porcelain >&2
            git --no-pager diff >&2
            exit 1
          fi
