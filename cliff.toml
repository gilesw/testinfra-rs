# Renders one changelog section from free-form commits; scripts/bump.sh splices
# it into CHANGELOG.md below the title.
[changelog]
trim = true
body = """
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits -%}
{% set subject = commit.message | split(pat="\n") | first | trim | trim_end_matches(pat=".") -%}
- {{ subject | upper_first }}.
{% endfor %}
"""

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "^v[0-9]"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Release [0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
  { message = "^Merge (branch|pull request|remote-tracking branch)", skip = true },
]
